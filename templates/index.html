<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linguago - Learn Languages</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        :root {
            --background-color: #f7fafc;
            --sidebar-color: #f7fafc;
            --text-color: #22223b;
            --accent-color: #3ecf8e;
            --accent-color-alt: #ffd600;
            --border-color: #b2e0f7;
        }
        body {
            background-color: var(--background-color);
            color: var(--text-color);
        }
        header {
            background: var(--sidebar-color);
        }
        .primary-btn {
            background: var(--accent-color);
            color: #fff;
        }
        .primary-btn:hover {
            background: var(--accent-color-alt);
            color: var(--text-color);
        }
        .secondary-btn {
            background: var(--sidebar-color);
            color: var(--text-color);
            border: 1px solid var(--accent-color);
        }
        .secondary-btn:hover {
            background: var(--accent-color-alt);
            color: var(--text-color);
        }
        .moving-shapes .shape1 {
            background: var(--accent-color-alt) !important;
        }
        .moving-shapes .shape2 {
            background: var(--accent-color) !important;
        }
        .moving-shapes .shape3 {
            border-bottom-color: var(--accent-color-alt) !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Lingua.ai Logo">
            </div>
        </header>
        <main class="content">
            <div class="text-content">
                <h1>Unlock Language Mastery with Gemini-Powered Worksheets</h1>
                <div class="buttons">
                    <a href="/login" class="btn primary-btn">Start Learning Now</a>
                    <a href="https://github.com/Yechiel82/Languagex" class="btn secondary-btn">Github</a>
                </div>
            </div>
            <div class="moving-shapes">
                <div class="shape shape1"></div>
                <div class="shape shape2"></div>
                <div class="shape shape3"></div>
            </div>
        </main>
    </div>
</body>
</html>
